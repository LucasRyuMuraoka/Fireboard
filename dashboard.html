    <!-- Lista de produtos -->
    <div>
      <h3>Lista de Produtos</h3>
      <div id="loading">Carregando...</div>
      <table id="productTabela" style="display: none;">

            <th>Nome</th>

  <script src="./js/config/firebaseConfig.js"></script>
  <script src="./js/model/product.js"></script>
  <script src="./js/services/productService.js"></script>
  <script src="./js/auth/auth.js"></script>
  <script>
    // Inicializar o serviço de produtos quando a página carregar
    document.addEventListener("DOMContentLoaded", function() {
      const productService = new ProductService();
      
      // Verificar autenticação
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          console.log("Usuário autenticado:", user.email);
          // Preencher o nome do usuário na barra superior
          const userNameElement = document.getElementById('userName');
          if (userNameElement) {
            userNameElement.textContent = user.displayName || user.email;
          }
          
          // Carregar lista de produtos
          productService.carregarProdutos();
          
          // Configurar formulário de adição de produtos
          const productForm = document.getElementById('productForm');
          if (productForm) {
            productForm.addEventListener('submit', function(e) {
              e.preventDefault();
              const name = document.getElementById('name').value;
              const price = document.getElementById('price').value;
              const description = document.getElementById('description').value;
              const stock = document.getElementById('stock').value;
              
              productService.adicionarProduto(name, price, description, stock)
                .then(() => {
                  // Limpar formulário
                  productForm.reset();
                  // Recarregar lista de produtos
                  productService.carregarProdutos();
                })
                .catch(error => {
                  document.getElementById('errorMessage').textContent = "Erro ao adicionar produto: " + error.message;
                  document.getElementById('errorMessage').style.color = 'red';
                });
            });
          }
          
          // Configurar formulário de edição de produtos
          const editProductForm = document.getElementById('editProductForm');
          if (editProductForm) {
            editProductForm.addEventListener('submit', function(e) {
              e.preventDefault();
              const productId = document.getElementById('editProductId').value;
              const name = document.getElementById('editName').value;
              const price = document.getElementById('editPrice').value;
              const description = document.getElementById('editDescription').value;
              const stock = document.getElementById('editStock').value;
              
              productService.salvarEdicaoProduto(productId, name, price, description, stock);
            });
          }
        } else {
          console.log("Usuário não autenticado, redirecionando...");
          window.location.href = "index.html";
        }
      });
      
      // Configurar botão de logout
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          firebase.auth().signOut()
            .then(() => {
              window.location.href = 'index.html';
            })
            .catch(error => {
              console.error('Erro ao fazer logout:', error);
            });
        });
      }
    });
  </script>
</body>
